[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "github-rate-gauge"
dynamic = ["version"]
description = "Windows desktop gauges for GitHub REST and GraphQL rate limits"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "Pillow>=10.4",
    "pystray>=0.19.5",
]

[project.optional-dependencies]
dev = [
    "black>=24.10",
    "ruff>=0.9",
]

[project.gui-scripts]
github-rate-gauge = "rate_gauge:main"

[tool.setuptools]
py-modules = ["preferences", "rate_gauge", "single_instance", "tray"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.data-files]
"share/github-rate-gauge" = ["VERSION"]
"share/github-rate-gauge/assets" = ["assets/gauge.ico", "assets/gauge.png"]

[tool.black]
target-version = ["py312"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
